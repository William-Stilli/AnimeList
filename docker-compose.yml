services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stuanimelist_app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=animelist
      - DB_USERNAME=stu
      - DB_PASSWORD=masterpassword
    depends_on:
      - db

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stuanimelist_queue
    restart: unless-stopped
    command: php artisan queue:work
    volumes:
      - .:/var/www
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=animelist
      - DB_USERNAME=stu
      - DB_PASSWORD=masterpassword
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: stuanimelist_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: animelist
      MYSQL_USER: stu
      MYSQL_PASSWORD: masterpassword
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - stuanimelist_mysql_data:/var/lib/mysql

volumes:
  stuanimelist_mysql_data: