services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stuanimelist_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite 
    volumes:
      - stuanimelist_db:/var/www/database

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stuanimelist_queue
    restart: unless-stopped
    command: php artisan queue:work
    environment:
      - APP_ENV=local
      - APP_DEBUG=false
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/var/www/database/database.sqlite 
    volumes:
      - stuanimelist_db:/var/www/database

volumes:
  stuanimelist_db: