version: '3.8'

services:
  app-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000" 
      - "5173:5173" 
    volumes:
      - .:/app
    command: >
      sh -c "composer install 
      && npm install 
      && php artisan serve --host=0.0.0.0 --port=8000 & npm run dev -- --host 0.0.0.0"